<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>外部控制台 · 探测与执行</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14;
      color: #e0e0e0;
      padding: 12px;
    }
    .card {
      background: #1e2229;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    h1 { font-size: 20px; color: #f0f0f0; margin-bottom: 8px; }
    h2 { font-size: 16px; color: #aaa; margin: 10px 0 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    label { display: block; margin: 6px 0 2px; font-size: 14px; color: #ccc; }
    textarea, input[type="text"] {
      width: 100%;
      background: #0b0e14;
      color: #b0d0ff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 14px;
      resize: vertical;
    }
    textarea { min-height: 100px; }
    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    button {
      background: #2a3a5a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      flex: 1 1 auto;
    }
    button:hover { background: #3a4a6a; }
    button.primary { background: #0d6efd; }
    button.primary:hover { background: #0b5ed7; }
    button.danger { background: #b02a37; }
    button.danger:hover { background: #a52834; }
    .output {
      background: #0b0e14;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      min-height: 120px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #b0d0ff;
    }
    .output .log-error { color: #ff6b6b; }
    .output .log-success { color: #6bcb6b; }
    .output .log-warn { color: #ffb347; }
    .output .log-info { color: #6bb3ff; }
    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #333;
      color: #ccc;
    }
    .status-badge.ok { background: #1a4a1a; color: #6bcb6b; }
    .status-badge.fail { background: #4a1a1a; color: #ff6b6b; }
    .status-badge.warn { background: #4a3a1a; color: #ffb347; }
    .var-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .var-tag {
      background: #2a2a3a;
      padding: 2px 10px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #b0d0ff;
    }
    .var-tag.found { background: #1a4a1a; color: #6bcb6b; }
    .var-tag.unknown { background: #4a3a1a; color: #ffb347; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛠️ 外部控制台 · 探测 & 执行</h1>
    <p style="color:#888; font-size:14px;">在当前页面执行 JS，或尝试与主页面通信（需主页面监听）</p>
  </div>

  <div class="card">
    <h2>💻 代码执行（当前页面环境）</h2>
    <textarea id="codeInput" placeholder="输入要执行的 JS 代码...">// 例如: alert('Hello')</textarea>
    <div class="button-row">
      <button class="primary" id="execBtn">执行</button>
      <button id="clearBtn">清空输出</button>
    </div>
    <div class="output" id="execOutput">// 输出结果</div>
  </div>

  <div class="card">
    <h2>📡 与主页面通信 (postMessage)</h2>
    <label>目标窗口</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
      <button id="msgOpenerBtn">发送给 opener</button>
      <button id="msgParentBtn">发送给 parent</button>
      <button id="msgTopBtn">发送给 top</button>
    </div>
    <label>消息内容 (JSON 格式)</label>
    <input type="text" id="msgData" value='{"cmd":"getVar","var":"userMessageEdit"}'>
    <div class="button-row">
      <button id="sendMsgBtn">发送</button>
    </div>
    <div class="output" id="msgOutput">// 消息日志</div>
  </div>

  <div class="card">
    <h2>🔍 变量探测（当前页面）</h2>
    <div id="varList" class="var-list">加载中...</div>
    <button id="probeBtn" style="margin-top:8px;">重新探测</button>
  </div>

  <div class="card">
    <h2>📋 环境信息</h2>
    <div id="envInfo" style="font-size:13px;color:#aaa;"></div>
  </div>

  <script>
    (function() {
      // ---------- 输出控制 ----------
      const execOutput = document.getElementById('execOutput');
      const msgOutput = document.getElementById('msgOutput');

      function logExec(msg, type='info') {
        const cls = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : type === 'warn' ? 'log-warn' : 'log-info';
        execOutput.innerHTML += `<div class="${cls}">${msg}</div>`;
        execOutput.scrollTop = execOutput.scrollHeight;
      }

      function logMsg(msg, type='info') {
        const cls = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : type === 'warn' ? 'log-warn' : 'log-info';
        msgOutput.innerHTML += `<div class="${cls}">${msg}</div>`;
        msgOutput.scrollTop = msgOutput.scrollHeight;
      }

      // ---------- 执行代码 ----------
      document.getElementById('execBtn').addEventListener('click', function() {
        const code = document.getElementById('codeInput').value;
        if (!code.trim()) { logExec('⚠️ 请输入代码', 'warn'); return; }
        try {
          const result = eval(code);
          logExec(`✅ 执行成功，返回值: ${String(result)}`, 'success');
        } catch(e) {
          logExec(`❌ 执行错误: ${e.message}`, 'error');
        }
      });

      document.getElementById('clearBtn').addEventListener('click', function() {
        execOutput.innerHTML = '// 输出已清空';
      });

      // ---------- 消息发送 ----------
      function sendMessage(target, targetName) {
        if (!target) { logMsg(`⚠️ 目标窗口 (${targetName}) 不存在`, 'warn'); return; }
        const data = document.getElementById('msgData').value;
        let parsed;
        try { parsed = JSON.parse(data); } catch(e) { parsed = data; }
        try {
          target.postMessage(parsed, '*');
          logMsg(`📤 已发送消息到 ${targetName}，数据: ${JSON.stringify(parsed)}`, 'success');
        } catch(e) {
          logMsg(`❌ 发送失败: ${e.message}`, 'error');
        }
      }

      document.getElementById('msgOpenerBtn').addEventListener('click', function() {
        sendMessage(window.opener, 'opener');
      });
      document.getElementById('msgParentBtn').addEventListener('click', function() {
        sendMessage(window.parent, 'parent');
      });
      document.getElementById('msgTopBtn').addEventListener('click', function() {
        sendMessage(window.top, 'top');
      });

      // 监听来自其他窗口的消息
      window.addEventListener('message', function(event) {
        logMsg(`📩 收到消息: 来源 ${event.origin}，数据: ${JSON.stringify(event.data)}`, 'info');
      });

      // ---------- 变量探测 ----------
      const knownVars = [
        'userMessageEdit', 'sendMessage', 'stopAI', 'aiMessageEditor', 'getScreen',
        'window', 'document', 'navigator', 'location'
      ];

      function probeVariables() {
        const container = document.getElementById('varList');
        let html = '';
        for (let name of knownVars) {
          let exists = false;
          try {
            exists = (typeof window[name] !== 'undefined');
          } catch(e) {}
          const cls = exists ? 'found' : 'unknown';
          const label = exists ? '✔' : '?';
          html += `<span class="var-tag ${cls}">${name} ${label}</span>`;
        }
        // 额外显示当前页面其他自定义属性
        const ownProps = Object.getOwnPropertyNames(window).filter(k => !knownVars.includes(k) && !k.startsWith('webkit') && !k.startsWith('on') && !k.startsWith('__'));
        if (ownProps.length > 0) {
          html += `<br><span style="color:#888;font-size:12px;">其他自定义属性: ${ownProps.slice(0,20).join(', ')}${ownProps.length>20?'...':''}</span>`;
        }
        container.innerHTML = html;
      }

      document.getElementById('probeBtn').addEventListener('click', probeVariables);
      probeVariables();

      // ---------- 环境信息 ----------
      function showEnv() {
        const el = document.getElementById('envInfo');
        el.innerHTML = `
          <div>User-Agent: ${navigator.userAgent}</div>
          <div>平台: ${navigator.platform}</div>
          <div>语言: ${navigator.language}</div>
          <div>窗口尺寸: ${window.innerWidth}×${window.innerHeight}</div>
          <div>协议: ${location.protocol}</div>
          <div>opener 存在: ${!!window.opener}</div>
          <div>parent 存在: ${window.parent !== window}</div>
          <div>top 存在: ${window.top !== window}</div>
        `;
      }
      showEnv();

      // 初始日志
      logExec('📌 外部控制台已加载，可以输入代码执行。', 'info');
      logMsg('📌 消息监听已启动，等待接收消息。', 'info');
    })();
  </script>
</body>
</html>
