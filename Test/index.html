<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>返回</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1e1e1e;
            font-family: Arial;
        }
        button {
            padding: 20px 50px;
            font-size: 24px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <button onclick="goBack()">⬅ 返回上一个页面</button>

    <script>
        function goBack() {
            // 1. 优先尝试关闭当前页（因为是从酒馆 window.open 出来的）
            if (window.opener) {
                try {
                    window.opener.focus(); // 尝试把焦点还给酒馆
                } catch(e) {}
                window.close(); // 关闭当前新页面
                
                // 如果安卓WebView禁止了 close，就跳转到空白页再后退
                setTimeout(() => {
                    window.location.href = 'about:blank';
                    window.history.back();
                }, 300);
            } else {
                // 2. 如果是直接打开的，就用浏览器的后退
                window.history.back();
            }
        }
    </script>
</body>
</html>
