<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>执行器 · 直接输出</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b0e14;
      color: #e0e0e0;
      font-family: 'Menlo', 'Consolas', monospace;
      padding: 16px;
    }
    .card {
      background: #1e2229;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    textarea {
      width: 100%;
      background: #0b0e14;
      color: #b0d0ff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 120px;
    }
    .btn {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #0b5ed7; }
    .output {
      background: #0b0e14;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      min-height: 100px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 14px;
      line-height: 1.6;
    }
    .log-error { color: #ff6b6b; }
    .log-success { color: #6bcb6b; }
    .log-info { color: #6bb3ff; }
    .log-warn { color: #ffb347; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧪 任意代码执行 · 直接输出</h1>
    <p style="color:#888; font-size:14px;">输入代码，点击执行。使用 <code>print(变量)</code> 查看值。</p>
    <textarea id="codeArea">// 示例: print(window.userMessageEdit)</textarea>
    <button class="btn" id="runBtn">执行</button>
  </div>
  <div class="card">
    <h2>📋 输出日志</h2>
    <div class="output" id="logArea">// 就绪</div>
  </div>

  <script>
    (function() {
      const log = document.getElementById('logArea');
      const code = document.getElementById('codeArea');
      const runBtn = document.getElementById('runBtn');

      // 全局 print 函数
      window.print = function(value) {
        let str;
        try {
          if (typeof value === 'string') str = value;
          else if (value === null) str = 'null';
          else if (value === undefined) str = 'undefined';
          else str = JSON.stringify(value, null, 2);
        } catch(e) {
          str = String(value);
        }
        const time = new Date().toLocaleTimeString();
        log.innerHTML += `<div class="log-info">[${time}] ${str}</div>`;
        log.scrollTop = log.scrollHeight;
        // 同时输出到浏览器控制台
        console.log(value);
      };

      runBtn.addEventListener('click', function() {
        const src = code.value.trim();
        if (!src) {
          log.innerHTML += `<div class="log-warn">⚠️ 请输入代码</div>`;
          log.scrollTop = log.scrollHeight;
          return;
        }
        // 清除之前可能存在的临时变量，避免干扰
        try {
          const result = eval(src);
          // 如果代码执行有返回值且不是 undefined，自动打印
          if (result !== undefined) {
            window.print(result);
          }
        } catch(err) {
          log.innerHTML += `<div class="log-error">❌ ${err.name}: ${err.message}</div>`;
          log.scrollTop = log.scrollHeight;
          console.error(err);
        }
      });

      // 快捷键：Ctrl+Enter 执行
      code.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          runBtn.click();
        }
      });
    })();
  </script>
</body>
</html>
