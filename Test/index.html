<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>执行器 · 直接输出</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b0e14;
      color: #e0e0e0;
      font-family: 'Menlo', 'Consolas', monospace;
      padding: 16px;
    }
    .card {
      background: #1e2229;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    textarea {
      width: 100%;
      background: #0b0e14;
      color: #b0d0ff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 120px;
    }
    .btn {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #0b5ed7; }
    .output {
      background: #0b0e14;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      min-height: 100px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 14px;
      line-height: 1.6;
    }
    .log-error { color: #ff6b6b; }
    .log-success { color: #6bcb6b; }
    .log-info { color: #6bb3ff; }
    .log-warn { color: #ffb347; }
    .highlight { color: #ffd700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧪 执行器 · 真的直接输出</h1>
    <p style="color:#888; font-size:14px;">
      直接输入变量名即可查看值，比如 <code>userMessageEdit</code><br>
      也可以写表达式：<code>1+2</code>、<code>document.title</code>
    </p>
    <textarea id="codeArea">userMessageEdit</textarea>
    <button class="btn" id="runBtn">执行</button>
  </div>
  <div class="card">
    <h2>📋 输出日志</h2>
    <div class="output" id="logArea">// 就绪</div>
  </div>

  <script>
    (function() {
      const log = document.getElementById('logArea');
      const code = document.getElementById('codeArea');
      const runBtn = document.getElementById('runBtn');

      // 真正的输出函数
      function output(value, type = 'info') {
        let str;
        try {
          if (value === undefined) str = 'undefined';
          else if (value === null) str = 'null';
          else if (typeof value === 'string') str = value;
          else if (typeof value === 'function') str = `[Function: ${value.name || 'anonymous'}]`;
          else if (typeof value === 'object') {
            try {
              str = JSON.stringify(value, (k, v) => {
                if (typeof v === 'function') return `[Function: ${v.name || 'anonymous'}]`;
                return v;
              }, 2);
            } catch(e) {
              str = String(value);
            }
          } else {
            str = String(value);
          }
        } catch(e) {
          str = `[无法序列化: ${e.message}]`;
        }
        const time = new Date().toLocaleTimeString();
        const cls = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : type === 'warn' ? 'log-warn' : 'log-info';
        log.innerHTML += `<div class="${cls}">[${time}] ${str}</div>`;
        log.scrollTop = log.scrollHeight;
        // 同时输出到控制台
        console.log(value);
      }

      // 劫持 console.log 也可以输出到日志
      const origLog = console.log;
      console.log = function(...args) {
        origLog(...args);
        args.forEach(arg => output(arg, 'info'));
      };

      runBtn.addEventListener('click', function() {
        const src = code.value.trim();
        if (!src) {
          output('⚠️ 请输入代码', 'warn');
          return;
        }

        try {
          // 直接 eval，如果有返回值就输出
          const result = eval(src);
          if (result !== undefined) {
            output(result, 'success');
          } else {
            // 如果结果是 undefined 但代码可能是赋值语句，不额外输出
            // 但我们可以友好提示
            output('✅ 执行完成（无返回值）', 'info');
          }
        } catch(err) {
          output(`❌ ${err.name}: ${err.message}`, 'error');
          console.error(err);
        }
      });

      // Ctrl+Enter 执行
      code.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          runBtn.click();
        }
      });

      // 初始提示
      output('📌 输入变量名或表达式，点击执行即可看到结果', 'info');
    })();
  </script>
</body>
</html>
