<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>极简执行器 · 显示源码</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b0e14;
      color: #e0e0e0;
      font-family: 'Menlo', 'Consolas', monospace;
      padding: 16px;
    }
    .card {
      background: #1e2229;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    textarea {
      width: 100%;
      background: #0b0e14;
      color: #b0d0ff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 120px;
    }
    .btn {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #0b5ed7; }
    .output {
      background: #0b0e14;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      min-height: 100px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 13px;
      line-height: 1.6;
    }
    .error { color: #ff6b6b; }
    .success { color: #6bcb6b; }
    .info { color: #6bb3ff; }
    .warn { color: #ffb347; }
    .source { color: #ffd700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ 极简执行器 · 显示源码</h1>
    <p style="color:#888; font-size:14px;">输入 JS 代码，点击执行。函数会显示完整源码。</p>
    <textarea id="codeArea">userMessageEdit</textarea>
    <button class="btn" id="runBtn">执行</button>
  </div>
  <div class="card">
    <h2>📋 输出</h2>
    <div class="output" id="logArea">// 就绪</div>
  </div>

  <script>
    (function() {
      const log = document.getElementById('logArea');
      const code = document.getElementById('codeArea');
      const runBtn = document.getElementById('runBtn');

      function logMsg(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const cls = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warn' ? 'warn' : 'info';
        log.innerHTML += `<div contenteditable class="${cls}">[${time}] ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
      }

      function stringifyValue(value) {
        if (value === undefined) return 'undefined';
        if (value === null) return 'null';
        if (typeof value === 'string') return `"${value}"`;
        if (typeof value === 'function') {
          // 显示函数源码
          try {
            const src = value.toString();
            // 限制长度避免刷屏，但保留全部
            return `<span class="source">${src}</span>`;
          } catch(e) {
            return `[Function: ${value.name || 'anonymous'}] (无法获取源码)`;
          }
        }
        if (typeof value === 'object') {
          try {
            return JSON.stringify(value, (k, v) => {
              if (typeof v === 'function') {
                try {
                  return `[Function: ${v.name || 'anonymous'}] ${v.toString()}`;
                } catch(e) {
                  return `[Function: ${v.name || 'anonymous'}]`;
                }
              }
              if (v === undefined) return 'undefined';
              return v;
            }, 2);
          } catch(e) {
            return String(value);
          }
        }
        return String(value);
      }

      runBtn.addEventListener('click', function() {
        const src = code.value.trim();
        if (!src) {
          logMsg('⚠️ 请输入代码', 'warn');
          return;
        }

        try {
          const result = eval(src);
          if (result === undefined) {
            logMsg('✅ 执行完成（返回值 undefined）', 'info');
          } else {
            logMsg(`✅ 结果: ${stringifyValue(result)}`, 'success');
          }
        } catch(err) {
          logMsg(`❌ ${err.name}: ${err.message}`, 'error');
          console.error(err);
        }
      });

      code.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          runBtn.click();
        }
      });

      logMsg('📌 输入变量名或表达式，点击执行', 'info');
    })();
  </script>
</body>
</html>
